apiVersion: argoproj.io/v1alpha1
kind: Application
# Argo CD keeps the app in sync with this repository.
metadata:
  name: secure-notes
  namespace: argocd
spec:
  project: default

  # Chart to deploy
  source:
    repoURL: https://gitlab.com/anassbougraine644/secure-notes.git
    targetRevision: main
    path: helm/secure-notes
    helm:
      valueFiles:
        - values.yaml

  # Deploy into the cluster's secure-notes namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: secure-notes

  syncPolicy:
    automated:
      prune: true # Remove resources deleted from Git
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
