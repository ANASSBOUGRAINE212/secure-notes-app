---

- name: Installing containerd
  block:
    - name: Adding the Docker package signing key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    - name: Adding the Docker package repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Installing containerd
      apt:
        name: containerd.io
        state: present
        update_cache: yes

    - name: Creating the containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Reading the default containerd config
      command: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Writing the containerd config with systemd cgroups enabled
      copy:
        content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: '0644'
      register: containerd_config

    - name: Restarting containerd after a config change
      systemd:
        name: containerd
        state: restarted
        enabled: yes
        daemon_reload: yes
      when: containerd_config.changed

    - name: Ensuring containerd is enabled and running
      systemd:
        name: containerd
        state: started
        enabled: yes
        daemon_reload: yes

  when: container_runtime == "containerd"
  tags:
    - containerd
    - runtime

- name: Adding the Kubernetes package signing key
  apt_key:
    url: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key
    keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: present
  tags:
    - kubernetes
    - repository

- name: Adding the Kubernetes package repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
    state: present
    filename: kubernetes
  tags:
    - kubernetes
    - repository

- name: Installing Kubernetes packages
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes
  tags:
    - kubernetes
    - packages

- name: Keeping Kubernetes packages at their installed version
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  tags:
    - kubernetes
    - packages

- name: Enabling and starting kubelet
  systemd:
    name: kubelet
    enabled: yes
    state: started
  tags:
    - kubernetes
    - kubelet
