---
# Installing only the network plugin selected in group_vars/all.yml.

- name: Installing Calico
  block:
    - name: Downloading the Calico manifest
      get_url:
        url: https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml
        dest: /tmp/calico.yaml
        mode: '0644'

    - name: Applying the Calico manifest
      command: kubectl apply -f /tmp/calico.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Waiting for Calico pods to become ready
      command: kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: calico_ready
      until: calico_ready.rc == 0
      retries: 5
      delay: 10
      ignore_errors: yes

  when: cni_plugin == "calico"
  tags:
    - calico

- name: Installing Flannel
  block:
    - name: Applying the Flannel manifest
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Waiting for Flannel pods to become ready
      command: kubectl wait --for=condition=Ready pods --all -n kube-flannel --timeout=300s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flannel_ready
      until: flannel_ready.rc == 0
      retries: 5
      delay: 10
      ignore_errors: yes

  when: cni_plugin == "flannel"
  tags:
    - flannel

- name: Installing Weave Net
  block:
    - name: Applying the Weave Net manifest
      command: >
        kubectl apply -f "https://cloud.weave.works/k8s/net?k8s-version=$(kubectl version | base64 | tr -d '\n')"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Waiting for Weave pods to become ready
      command: kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: weave_ready
      until: weave_ready.rc == 0
      retries: 5
      delay: 10
      ignore_errors: yes

  when: cni_plugin == "weave"
  tags:
    - weave
