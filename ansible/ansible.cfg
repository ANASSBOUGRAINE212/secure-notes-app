[defaults]
# Use this directory's inventory unless another path is passed on the command line.
inventory = inventory.ini

# Disable host key checking for easier automation (use with caution in production)
host_key_checking = False

# Use Python 3
interpreter_python = auto_silent

# Number of parallel processes
forks = 5

# Timeout for gathering facts
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Logging
log_path = ./ansible.log

# Roles path
roles_path = ./roles

# Retry files
retry_files_enabled = False

# Display settings
display_skipped_hosts = False
display_ok_hosts = True

# Privilege escalation
[privilege_escalation]
# Run tasks as root through sudo; this is needed for system configuration.
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# SSH settings
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
