events {}

http {
    server {
        listen 8080;

        # dedicated health check endpoint - doesn't proxy anywhere,
        # just returns 200 so Kubernetes knows the gateway itself is alive
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
            access_log off;  # don't spam logs with health check hits
        }

        # anything starting with /auth goes to auth-service
        location /auth/ {
            proxy_pass http://auth-service:8001/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # anything starting with /notes goes to notes-service
        location /notes {
            proxy_pass http://notes-service:8002/notes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}