events {}

http {
    server {
        listen 8080;

        # Health check endpoint
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
            access_log off;  
        }

        # Auth API
        location /auth/ {
            proxy_pass http://auth-service:8001/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Notes API
        location /notes {
            proxy_pass http://notes-service:8002/notes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
