{{- if .Values.ingress.enabled -}}
# App routes
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-notes-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
        {{- range .paths }}
        - path: {{ .path }}
          pathType: {{ .pathType }}
          backend:
            service:
              name: {{ if eq .backend "frontend" }}{{ $.Values.frontend.name }}{{ else if eq .backend "gateway" }}{{ $.Values.gateway.name }}{{ else }}{{ .backend }}{{ end }}
              port:
                number: {{ if eq .backend "frontend" }}{{ $.Values.frontend.service.port }}{{ else if eq .backend "gateway" }}{{ $.Values.gateway.service.port }}{{ else }}80{{ end }}
        {{- end }}
  {{- end }}
{{- end }}
