{{- if .Values.secrets.create }}
# App secrets
# Replace these example values before enabling the template.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
type: Opaque
stringData:
  AUTH_DB_USER: auth_user
  AUTH_DB_PASSWORD: PASSWORD
  AUTH_DB_NAME: auth_db

  NOTES_DB_USER: notes_user
  NOTES_DB_PASSWORD: PASSWORD
  NOTES_DB_NAME: notes_db

  # Database URLs
  AUTH_DATABASE_URL: postgresql://auth_user:PASSWORD@auth-db:5432/auth_db
  NOTES_DATABASE_URL: postgresql://notes_user:PASSWORD@notes-db:5432/notes_db

  # JWT secret
  # Replace with a random value before deployment.
  JWT_SECRET: SECRET
{{- end }}
