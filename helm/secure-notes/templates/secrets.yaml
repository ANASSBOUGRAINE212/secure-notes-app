{{- if .Values.secrets.create }}
# Development example only. Create real credentials outside this chart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
type: Opaque
stringData:
  AUTH_DB_USER: auth_user
  AUTH_DB_PASSWORD: CHANGE_ME_STRONG_PASSWORD_HERE
  AUTH_DB_NAME: auth_db

  NOTES_DB_USER: notes_user
  NOTES_DB_PASSWORD: CHANGE_ME_STRONG_PASSWORD_HERE
  NOTES_DB_NAME: notes_db

  # Format: postgresql://user:password@host:port/database
  AUTH_DATABASE_URL: postgresql://auth_user:CHANGE_ME_STRONG_PASSWORD_HERE@auth-db:5432/auth_db
  NOTES_DATABASE_URL: postgresql://notes_user:CHANGE_ME_STRONG_PASSWORD_HERE@notes-db:5432/notes_db

  # Generate a secure random secret with: openssl rand -hex 32
  JWT_SECRET: CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32
{{- end }}
