global:
  namespace: secure-notes

# Container images
imageRegistry: docker.io
imageOrganization: anasbougraine
imagePullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-secret

# Auth service
authService:
  name: auth-service
  replicaCount: 1
  
  image:
    repository: auth-service
    tag: "905989a4"
  
  service:
    type: ClusterIP
    port: 8001
    targetPort: 8001
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  startupProbe:
    httpGet:
      path: /
      port: 8001
    periodSeconds: 5
    failureThreshold: 24
  
  livenessProbe:
    httpGet:
      path: /
      port: 8001
    initialDelaySeconds: 10
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /
      port: 8001
    initialDelaySeconds: 5
    periodSeconds: 5

# Notes service
notesService:
  name: notes-service
  replicaCount: 1
  
  image:
    repository: notes-service
    tag: "905989a4"
  
  service:
    type: ClusterIP
    port: 8002
    targetPort: 8002
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  livenessProbe:
    httpGet:
      path: /
      port: 8002
    initialDelaySeconds: 10
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /
      port: 8002
    initialDelaySeconds: 5
    periodSeconds: 5

# API gateway
gateway:
  name: gateway
  replicaCount: 1
  
  image:
    repository: gateway
    tag: "905989a4"
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 3
    periodSeconds: 5

# Frontend
frontend:
  name: frontend
  replicaCount: 1
  
  image:
    repository: frontend
    tag: "905989a4"
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 3
    periodSeconds: 5

# Databases
authDatabase:
  name: auth-db
  replicaCount: 1
  
  image:
    repository: postgres
    tag: "16"
  
  service:
    type: ClusterIP
    port: 5432
  
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""  # Use the default StorageClass
    accessMode: ReadWriteOnce
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

notesDatabase:
  name: notes-db
  replicaCount: 1
  
  image:
    repository: postgres
    tag: "16"
  
  service:
    type: ClusterIP
    port: 5432
  
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""  # Use the default StorageClass
    accessMode: ReadWriteOnce
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Ingress
ingress:
  enabled: true
  className: traefik
  annotations: {}
  
  hosts:
    - host: ""  # Leave empty to match any host
      paths:
        - path: /
          pathType: Prefix
          backend: frontend
        - path: /auth
          pathType: Prefix
          backend: gateway
        - path: /notes
          pathType: Prefix
          backend: gateway
  
  tls: []

# App secrets
secrets:
  name: notes-secrets
  create: false

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  annotations: {}
  name: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
