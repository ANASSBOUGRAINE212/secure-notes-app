# Default values used by the chart templates.

# Namespace
global:
  namespace: secure-notes

# Image registry
imageRegistry: docker.io
imageOrganization: anasbougraine
imagePullPolicy: IfNotPresent

# Image pull secrets for private Docker registry
imagePullSecrets:
  - name: dockerhub-secret

# Auth service
authService:
  name: auth-service
  replicaCount: 1
  
  image:
    repository: auth-service
    tag: "905989a4"  # Updated by CI/CD pipeline
  
  service:
    type: ClusterIP
    port: 8001
    targetPort: 8001
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  livenessProbe:
    httpGet:
      path: /
      port: 8001
    initialDelaySeconds: 10
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /
      port: 8001
    initialDelaySeconds: 5
    periodSeconds: 5

# Notes service
notesService:
  name: notes-service
  replicaCount: 1
  
  image:
    repository: notes-service
    tag: "905989a4"  # Updated by CI/CD pipeline
  
  service:
    type: ClusterIP
    port: 8002
    targetPort: 8002
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  livenessProbe:
    httpGet:
      path: /
      port: 8002
    initialDelaySeconds: 10
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /
      port: 8002
    initialDelaySeconds: 5
    periodSeconds: 5

# Gateway
gateway:
  name: gateway
  replicaCount: 1
  
  image:
    repository: gateway
    tag: "905989a4"  # Updated by CI/CD pipeline
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 3
    periodSeconds: 5

# Frontend
frontend:
  name: frontend
  replicaCount: 1
  
  image:
    repository: frontend
    tag: "905989a4"  # Updated by CI/CD pipeline
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 3
    periodSeconds: 5

# Auth database
authDatabase:
  name: auth-db
  replicaCount: 1
  
  image:
    repository: postgres
    tag: "16"
  
  service:
    type: ClusterIP
    port: 5432
  
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""  # Use default storage class
    accessMode: ReadWriteOnce
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Notes database
notesDatabase:
  name: notes-db
  replicaCount: 1
  
  image:
    repository: postgres
    tag: "16"
  
  service:
    type: ClusterIP
    port: 5432
  
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""  # Use default storage class
    accessMode: ReadWriteOnce
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Ingress
ingress:
  enabled: true
  className: ""  # Use default ingress class
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  
  hosts:
    - host: ""  # Leave empty for default
      paths:
        - path: /
          pathType: Prefix
          backend: frontend
        - path: /auth
          pathType: Prefix
          backend: gateway
        - path: /notes
          pathType: Prefix
          backend: gateway
  
  tls: []
    # - secretName: secure-notes-tls
    #   hosts:
    #     - secure-notes.example.com

# Keeping real credentials out of this file; create the Secret separately.

secrets:
  name: notes-secrets
  create: false

# Pod security
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Scheduling
nodeSelector: {}

tolerations: []

affinity: {}
