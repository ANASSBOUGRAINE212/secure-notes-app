apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-notes-ingress
  namespace: secure-notes
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 80
      - path: /notes
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 80